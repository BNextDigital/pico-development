# C++ core
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_GLIBCXX_LIBCPP=y

# Diagnostics during the prototype phase
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_MAIN_STACK_SIZE=4096

# Physical I/O. Every peripheral remains optional at devicetree level.
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

# BLE peripheral with encrypted/bonded GATT access and a private address.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_SMP_MIN_ENC_KEY_SIZE=16
CONFIG_BT_GATT_AUTHORIZATION_CUSTOM=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_DEVICE_NAME="Pico"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_SETTINGS=y

# On-device state and Bluetooth bond persistence.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_PICO_DISPLAY=y
CONFIG_PICO_SETTINGS=y
