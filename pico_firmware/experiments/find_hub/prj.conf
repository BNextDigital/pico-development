# Preserve the XIAO UF2 bootloader; package only through the guarded helper.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BUILD_OUTPUT_UF2=n
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_APP_DFU=n
CONFIG_DK_LIBRARY=n
CONFIG_BT_DEVICE_NAME="Pico FHN prototype"
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Pico isolated Find Hub prototype"
CONFIG_BT_FAST_PAIR_FHN_DULT_MODEL_NAME="Pico FHN prototype"
CONFIG_BT_FAST_PAIR_FHN_DULT_MANUFACTURER_NAME="BNextDigital"
CONFIG_BT_FAST_PAIR_FHN_RING_COMP_ONE=y
# Battery is explicitly unavailable; do not advertise a fake 100% reading.
CONFIG_BT_FAST_PAIR_FHN_BATTERY_DULT=n
# No DK-specific TX correction is asserted as calibrated for the XIAO antenna.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_NONE=y
CONFIG_LSM6DSL_ACCEL_FS=4
CONFIG_LSM6DSL_ACCEL_ODR=0
CONFIG_LSM6DSL_GYRO_ODR=0
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
CONFIG_BOOT_DELAY=1000
CONFIG_BT_FAST_PAIR_FHN_DULT_FIRMWARE_VERSION_MAJOR=0
CONFIG_BT_FAST_PAIR_FHN_DULT_FIRMWARE_VERSION_MINOR=1
CONFIG_BT_FAST_PAIR_FHN_DULT_FIRMWARE_VERSION_REVISION=0
