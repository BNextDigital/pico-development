# Retain the factory UF2 bootloader and generate its drag-and-drop image.
# The SDK's XIAO board definition supplies the application flash partition.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BUILD_OUTPUT_UF2=y

# The XIAO board enables hardware stack protection / MPU_STACK_GUARD.
# STACK_SENTINEL requires !MPU_STACK_GUARD; override the generic prj.conf request.
CONFIG_STACK_SENTINEL=n

# Give the USB console a short startup window; do not wait for a terminal.
CONFIG_BOOT_DELAY=1000

# Keep diagnostics available after USB reconnects and startup logs are gone.
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=n
CONFIG_PICO_BRINGUP_DIAGNOSTICS=y

# Let the phone initiate Bond instead of issuing a competing security request.
# GATT command/status access still requires encryption.
CONFIG_PICO_BLE_AUTO_SECURITY=n
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
